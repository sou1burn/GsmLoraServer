name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0
  MOCKGEN_VERSION: v1.6.0
  BUF_VERSION: v1.75.0
  PROTOC_GEN_GO_VERSION: v1.36.12

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: race-detect
        run: go test -race -count=1 ./...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: govulncheck
        run: govulncheck ./...

  mocks:
    name: mocks up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install mockgen
        run: go install github.com/golang/mock/mockgen@${{ env.MOCKGEN_VERSION }}
      - name: mocks (make mocks)
        run: make mocks

  proto:
    name: proto lint + generated up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install buf + protoc-gen-go
        run: |
          go install github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }}
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${{ env.PROTOC_GEN_GO_VERSION }}
      - name: buf lint
        run: buf lint
      - name: buf breaking (vs main, PRs only)
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=origin/main'
      - name: generated code up-to-date (make proto)
        run: |
          buf generate
          git diff --exit-code -- api/proto

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: make tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: bin (make build)
        run: make build
