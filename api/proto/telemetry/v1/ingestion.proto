syntax = "proto3";

package telemetry.v1;

import "telemetry/v1/client.proto";
import "telemetry/v1/types.proto";

option go_package = "github.com/sou1burn/GsmLoraServer/api/proto/telemetry/v1;telemetryv1";

// Сервис приёма телеметрии. Реализация — cmd/ingestion (этап 1),
// единственный клиент — cmd/api.
//
// Конверты ClientCommand/ServerToClient — канонические типы домена,
// RPC-обёртки — транспортный слой вокруг них.
service IngestionService {
  // SetSettings / StartMeasurement приезжают внутри
  // конверта ClientCommand (ребро клиент-TCP остаётся текстовым).
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);

  // Чтения и CRUD сессий. Владелец БД на этапе 1 — ingestion.
  rpc GetSessions(GetSessionsRequest) returns (GetSessionsResponse);
  rpc AddSession(AddSessionRequest) returns (AddSessionResponse);
  rpc RemoveSession(RemoveSessionRequest) returns (RemoveSessionResponse);

  // История сессии. session_id = 0 — «последняя сессия».
  rpc GetPackets(GetPacketsRequest) returns (stream GetPacketsResponse);

  // Поток событий к api: MeasurementBroadcast, DeviceStatusChanged, SettingsConfirmed, CommandError.
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream SubscribeEventsResponse);
}

// --- ExecuteCommand: конверт + результат -------------------------------

message ExecuteCommandRequest {
  ClientCommand command = 1;
}

message ExecuteCommandResponse {
  ExecuteStatus status = 1;
}

enum ExecuteStatus {
  EXECUTE_STATUS_UNSPECIFIED = 0;
  // Команда принята и отправлена на ESP (или уже применена).
  EXECUTE_STATUS_ACCEPTED = 1;
  // ESP offline: команда положена в pending и уйдёт при подключении
  EXECUTE_STATUS_PENDING_ESP_OFFLINE = 2;
  // Отказ: невалидные параметры, «настройки уже заданы» (ALREADY_SET) и т.п.
  EXECUTE_STATUS_REJECTED = 3;
}

// --- Сессии ------------------------------------------------------------

message GetSessionsRequest {}

message GetSessionsResponse {
  SessionList session_list = 1;
}

message AddSessionRequest {
  AddSession add_session = 1;
}

message AddSessionResponse {
  reserved 1;
}

message RemoveSessionRequest {
  int64 session_id = 1;
}

message RemoveSessionResponse {}

// --- Пакеты и события ---------------------------------------------------

message GetPacketsRequest {
  // 0 — «последняя сессия».
  int64 session_id = 1;
}

message GetPacketsResponse {
  Packet packet = 1;
}

message SubscribeEventsRequest {}

message SubscribeEventsResponse {
  ServerToClient event = 1;
}
